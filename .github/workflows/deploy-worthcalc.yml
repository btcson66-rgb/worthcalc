name: Deploy WorthCalc

on:
  push:
    branches: [main]
    paths:
      - 'sites/worth-it-tools/**'
      - '.github/workflows/deploy-worthcalc.yml'
  # Daily release window for the money-brief cluster. Those pages are gated on a
  # publishAt date in their own frontmatter (sites/worth-it-tools/src/lib/publication.ts),
  # so a page written today does not appear until its date arrives — and it only
  # appears if something rebuilds the site on that date. Nothing else in this
  # repo does that: the push trigger above fires when a human merges, which is
  # exactly what the date gate exists to decouple from.
  #
  # 03:20 UTC rather than the hour: GitHub queues scheduled workflows and drops
  # them under load at popular times, and on-the-hour crons are the most popular
  # times there are.
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:
    inputs:
      ci_only:
        description: 'Run verify only; skip Pages deploy, IndexNow, and GSC submission.'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-worthcalc
  cancel-in-progress: true

jobs:
  # Scheduled runs only. A rebuild on a day with no release produces byte-identical
  # output, so deploying it would burn ~15 minutes of CI and resubmit every sitemap
  # URL to IndexNow for no change. This decides whether the night is a release night.
  # Push and workflow_dispatch runs skip this job entirely and build unconditionally.
  release-window:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.due.outputs.due }}
      count: ${{ steps.due.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: due
        run: node sites/worth-it-tools/scripts/check-due-briefs.mjs
      - name: 摘要
        run: |
          echo "due=${{ steps.due.outputs.due }} count=${{ steps.due.outputs.count }}" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: [release-window]
    # `always()` is required because release-window is skipped on push and
    # workflow_dispatch; without it a skipped dependency would skip the build and
    # no merge would ever deploy again.
    if: always() && (github.event_name != 'schedule' || needs.release-window.outputs.due == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/worth-it-tools
    steps:
      - uses: actions/checkout@v4
        with:
          # scripts/sitemap-lastmod.mjs derives each URL's lastmod from the git
          # author date of its source file. The default shallow clone exposes a
          # single commit, which would collapse all 341 URLs onto the build date
          # — the exact bug this change exists to remove.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sites/worth-it-tools/package-lock.json
      - run: npm ci
      - run: npm run verify
        env:
          SITE_URL: https://worthcalc.win
          PUBLIC_GA_ID: ${{ vars.WORTHCALC_GA_ID }}
          PUBLIC_AFFILIATE_GA_ID: G-Q78WN8NZ0R
          # 2026-08-24: was ${{ vars.WORTHCALC_ADSENSE_CLIENT }}. That repo
          # variable was never set (see the 2026-07-10 AdSense playbook), so
          # every build injected an empty string and neither the head loader
          # nor AdSlot rendered anything — which would silently block AdSense
          # review. The publisher ID is public information anyway (it is served
          # verbatim in public/ads.txt), so it is written literally here, the
          # same way roomfeng does it, rather than depending on an invisible
          # repo setting. Keep this in sync with
          # sites/worth-it-tools/public/ads.txt — AdSense matches the two.
          # Account: zxc851558 (the previous account btcson66 can no longer be
          # signed into).
          PUBLIC_ADSENSE_CLIENT: ca-pub-9117672212804270
          # No PUBLIC_GSC_VERIFICATION here: the WORTHCALC_GSC_VERIFICATION repo
          # variable was never set, and worthcalc.win is verified in Search
          # Console as a domain property via a DNS TXT record (see the
          # google-site-verification TXT record on the apex domain and the
          # sc-domain:worthcalc.win usage in the gsc-submit job below), which
          # already covers the whole domain. The HTML-tag path in SEO.astro
          # (PUBLIC_GSC_VERIFICATION env var) still exists for future use if a
          # URL-prefix property is ever added; set the repo variable again if so.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sites/worth-it-tools/dist

  deploy:
    needs: build
    # 2026-09-19 起 push 觸發的部署全部沒有發生，原因在這一行。
    #
    # release-window 只在 schedule 時執行，push 時是 skipped。GitHub Actions 會把
    # skipped 沿著 needs 鏈往下傳：一個沒有使用 always()／!cancelled() 之類狀態函式
    # 的 if，隱含條件是 success()，而 success() 看的是整條相依closure，不只直接
    # needs。build 自己用 always() 擋住了，下游三個 job 沒有，於是 #179（09-19，
    # PR #170 加入 release-window 的那次）之後每一次 merge 都只 build 不部署——
    # 對照 #176／#178（09-15，還沒有 release-window）三個 job 都正常執行。
    #
    # 結果是網站只靠每天 03:20 UTC 的排程更新，合併後最多 24 小時才上線。
    # needs.<job>.result 明確檢查上游結果，取代那個隱含的 success()。
    if: always() && needs.build.result == 'success'
      && (github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.ci_only != true))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    # 同 deploy：明確檢查上游結果，否則 release-window 的 skipped 會傳遞下來。
    if: always() && needs.deploy.result == 'success'
      && (github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.ci_only != true))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Waits a moment so the fresh deployment serves the key file, then
      # submits every sitemap URL to IndexNow (Bing/Yandex/Seznam/Naver).
      - run: sleep 60 && node sites/worth-it-tools/scripts/submit-indexnow.mjs
        env:
          INDEXNOW_KEY: a0971145939fb4fcb7b5ff0e736761fc

  gsc-submit:
    needs: deploy
    # 同 deploy：明確檢查上游結果，否則 release-window 的 skipped 會傳遞下來。
    if: always() && needs.deploy.result == 'success'
      && (github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.ci_only != true))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Uses the sc-domain:worthcalc.win property (not a URL-prefix property).
      # The owner user OAuth identity is preferred, with the service account as
      # a legacy fallback only when user OAuth is absent. Do not add
      # "if secret exists" 這種靜默略過的守門條件——缺憑證要讓 job 失敗、
      # 讓人看到，而不是悄悄跳過（CLAUDE.md 紅線第 6 條）。
      #
      # The plural script reads the index and child sitemap states. It registers
      # only missing entries, reports long-lived pending as a warning, and fails
      # only for authentication, API, or public sitemap errors.
      - run: sleep 60 && node sites/worth-it-tools/scripts/gsc-submit-sitemaps.mjs
        env:
          FABLE_OPS_OAUTH_CLIENT_JSON: ${{ secrets.FABLE_OPS_OAUTH_CLIENT_JSON }}
          FABLE_OPS_REFRESH_TOKEN: ${{ secrets.FABLE_OPS_REFRESH_TOKEN }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
