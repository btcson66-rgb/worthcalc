name: Deploy WorthCalc

on:
  push:
    branches: [main]
    paths:
      - 'sites/worth-it-tools/**'
      - '.github/workflows/deploy-worthcalc.yml'
  # 2026-10-15 (SEO rebuild P1): the nightly `schedule` trigger that released
  # money briefs by publishAt date was removed. During the rebuild nothing may go
  # live without review, and a date-gated brief going live on a cron is exactly
  # an unreviewed page. Briefs dated after 2026-10-15 are marked `draft: true`;
  # a human flips them when the rebuild plan says so. Deploys now happen only on
  # a merge to main (push) or by hand (workflow_dispatch).
  workflow_dispatch:
    inputs:
      ci_only:
        description: 'Run verify only; skip Pages deploy, IndexNow, and GSC submission.'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-worthcalc
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/worth-it-tools
    steps:
      - uses: actions/checkout@v4
        with:
          # scripts/sitemap-lastmod.mjs derives each URL's lastmod from the git
          # author date of its source file. The default shallow clone exposes a
          # single commit, which would collapse all 341 URLs onto the build date
          # — the exact bug this change exists to remove.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sites/worth-it-tools/package-lock.json
      - run: npm ci
      - run: npm run verify
        env:
          SITE_URL: https://worthcalc.win
          PUBLIC_GA_ID: ${{ vars.WORTHCALC_GA_ID }}
          PUBLIC_AFFILIATE_GA_ID: G-Q78WN8NZ0R
          # 2026-08-24: was ${{ vars.WORTHCALC_ADSENSE_CLIENT }}. That repo
          # variable was never set (see the 2026-07-10 AdSense playbook), so
          # every build injected an empty string and neither the head loader
          # nor AdSlot rendered anything — which would silently block AdSense
          # review. The publisher ID is public information anyway (it is served
          # verbatim in public/ads.txt), so it is written literally here, the
          # same way roomfeng does it, rather than depending on an invisible
          # repo setting. Keep this in sync with
          # sites/worth-it-tools/public/ads.txt — AdSense matches the two.
          # Account: zxc851558 (the previous account btcson66 can no longer be
          # signed into).
          PUBLIC_ADSENSE_CLIENT: ca-pub-9117672212804270
          # No PUBLIC_GSC_VERIFICATION here: the WORTHCALC_GSC_VERIFICATION repo
          # variable was never set, and worthcalc.win is verified in Search
          # Console as a domain property via a DNS TXT record (see the
          # google-site-verification TXT record on the apex domain and the
          # sc-domain:worthcalc.win usage in the gsc-submit job below), which
          # already covers the whole domain. The HTML-tag path in SEO.astro
          # (PUBLIC_GSC_VERIFICATION env var) still exists for future use if a
          # URL-prefix property is ever added; set the repo variable again if so.
      - name: Restore last accepted IndexNow baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run_id in $(gh run list --workflow deploy-worthcalc.yml --branch main --status completed --limit 20 --json databaseId --jq '.[].databaseId'); do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" --jq '[.artifacts[] | select(.name == "worthcalc-indexnow-accepted" and .expired == false)] | length')
            if [ "$count" != "0" ]; then
              gh run download "$run_id" --name worthcalc-indexnow-accepted --dir indexnow-prior
              cp indexnow-prior/indexnow-accepted.json indexnow-previous-accepted.json
              break
            fi
          done
      - name: Prepare changed URL plan against the last accepted baseline
        run: node scripts/indexnow-plan.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: indexnow-plan
          path: sites/worth-it-tools/indexnow-plan.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sites/worth-it-tools/dist

  deploy:
    needs: build
    # 2026-10-15：release-window job 與 schedule 觸發已移除（見檔頭註解），
    # 這裡不再有 skipped 沿 needs 鏈傳遞的問題；仍保留明確的 result 檢查，
    # 讓 build 失敗時下游一定不會部署。
    if: always() && needs.build.result == 'success'
      && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.ci_only != true))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    # 同 deploy：明確檢查上游結果。
    if: always() && needs.deploy.result == 'success'
      && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.ci_only != true))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: indexnow-plan
      # Only the precomputed changed/removed subset, in batches of at most 50.
      # A first deployment initializes its baseline without a full-site submit.
      - run: sleep 60 && node sites/worth-it-tools/scripts/submit-indexnow.mjs indexnow-plan.json
        env:
          INDEXNOW_KEY: a0971145939fb4fcb7b5ff0e736761fc
      - uses: actions/upload-artifact@v4
        with:
          name: worthcalc-indexnow-accepted
          path: indexnow-accepted.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: indexnow-submission-log
          path: indexnow-submission-log.json
          if-no-files-found: warn

  gsc-submit:
    needs: deploy
    # 同 deploy：明確檢查上游結果。
    if: always() && needs.deploy.result == 'success'
      && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.ci_only != true))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Uses the sc-domain:worthcalc.win property (not a URL-prefix property).
      # The owner user OAuth identity is preferred, with the service account as
      # a legacy fallback only when user OAuth is absent. Do not add
      # "if secret exists" 這種靜默略過的守門條件——缺憑證要讓 job 失敗、
      # 讓人看到，而不是悄悄跳過（CLAUDE.md 紅線第 6 條）。
      #
      # The plural script reads the index and child sitemap states. It registers
      # only missing entries, reports long-lived pending as a warning, and fails
      # only for authentication, API, or public sitemap errors.
      - run: sleep 60 && node sites/worth-it-tools/scripts/gsc-submit-sitemaps.mjs
        env:
          FABLE_OPS_OAUTH_CLIENT_JSON: ${{ secrets.FABLE_OPS_OAUTH_CLIENT_JSON }}
          FABLE_OPS_REFRESH_TOKEN: ${{ secrets.FABLE_OPS_REFRESH_TOKEN }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
