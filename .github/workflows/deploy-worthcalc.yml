name: Deploy WorthCalc

on:
  push:
    branches: [main]
    paths:
      - 'sites/worth-it-tools/**'
      - '.github/workflows/deploy-worthcalc.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-worthcalc
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/worth-it-tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sites/worth-it-tools/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://worthcalc.win
          PUBLIC_GA_ID: ${{ vars.WORTHCALC_GA_ID }}
          PUBLIC_ADSENSE_CLIENT: ${{ vars.WORTHCALC_ADSENSE_CLIENT }}
          # No PUBLIC_GSC_VERIFICATION here: the WORTHCALC_GSC_VERIFICATION repo
          # variable was never set, and worthcalc.win is verified in Search
          # Console as a domain property via a DNS TXT record (see the
          # google-site-verification TXT record on the apex domain and the
          # sc-domain:worthcalc.win usage in the gsc-submit job below), which
          # already covers the whole domain. The HTML-tag path in SEO.astro
          # (PUBLIC_GSC_VERIFICATION env var) still exists for future use if a
          # URL-prefix property is ever added; set the repo variable again if so.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sites/worth-it-tools/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Waits a moment so the fresh deployment serves the key file, then
      # submits every sitemap URL to IndexNow (Bing/Yandex/Seznam/Naver).
      - run: sleep 60 && node sites/worth-it-tools/scripts/submit-indexnow.mjs
        env:
          INDEXNOW_KEY: a0971145939fb4fcb7b5ff0e736761fc

  gsc-submit:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 2026-08-01（CEO 派工）：worthcalc 之前完全沒有 GSC 提交步驟，sitemap
      # 停在 2026-07-22 一次性手動提交後從未再送出。這裡補上，樣式抄自
      # funnytools 修好後的 gsc-submit-sitemaps.mjs（domain property
      # sc-domain:worthcalc.win，不是 URL-prefix，避免 403）。不加
      # "if secret exists" 這種靜默略過的守門條件——缺憑證要讓 job 失敗、
      # 讓人看到，而不是悄悄跳過（CLAUDE.md 紅線第 6 條）。
      - run: sleep 60 && node sites/worth-it-tools/scripts/gsc-submit-sitemap.mjs
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
